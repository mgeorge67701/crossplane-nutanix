apiVersion: nutanix.crossplane.io/v1alpha1
kind: VirtualMachine
metadata:
  name: example-vm
spec:
  name: "my-crossplane-vm"
  numVcpus: 2
  memorySizeMib: 4096
  clusterName: "aza-ntnx-01"
  datacenter: "dc-alpha"
  imageName: "ubuntu-22.04-cloud"
  subnetName: "my-network-subnet"
  lob: "CLOUD"
  providerConfigRef:
    name: all-features-config
