name: Release Provider

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push multi-arch controller image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv $HOME/.up/bin/up /usr/local/bin/
          up --help | head -5
          
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to Upbound Registry
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          if [ -n "$UPBOUND_ACCESS_ID" ] && [ -n "$UPBOUND_TOKEN" ]; then
            up login --username="${UPBOUND_ACCESS_ID}" --password="${UPBOUND_TOKEN}"
            echo "Successfully logged in to Upbound"
          else
            echo "Upbound credentials not found, will skip Upbound registry push"
          fi

      - name: Build Crossplane package
        run: |
          up xpkg build --package-root=crossplane-package --controller=ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }}
          
      - name: Push to GitHub Container Registry
        run: |
          up xpkg push ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }} -f crossplane-package/*.xpkg

      - name: Push to Upbound Registry
        run: |
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }} -f crossplane-package/*.xpkg

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crossplane-package/*.xpkg
            crossplane-package/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
