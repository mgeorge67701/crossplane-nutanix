name: Release Provider

# DISABLED - Using multiarch-build.yml instead
on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push multi-arch controller image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }}-controller

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          echo "$HOME/.up/bin" >> $GITHUB_PATH
          
      - name: Login to GitHub Container Registry for Upbound
        run: echo "${{ secrets.GITHUB_TOKEN }}" | up registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Crossplane package
        run: |
          up xpkg build --package-root=package --controller=ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }}-controller
          
      - name: Push Crossplane package
        run: |
          up xpkg push ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ github.ref_name }} -f package/*.xpkg

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/*.xpkg
            package/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
