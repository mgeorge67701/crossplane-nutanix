name: Multi-Architecture Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.3.45)'
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/provider-nutanix

jobs:
  # Auto-tag version
  auto-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      should_build: ${{ steps.set_version.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and create version tag
        id: set_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.2.40")
          
          # Extract version numbers
          ver=${LAST_TAG#v}
          IFS='.' read -r major minor patch <<< "$ver"
          major=${major:-0}
          minor=${minor:-2}
          patch=${patch:-40}
          
          # Increment patch version
          patch=$((patch+1))
          NEW_TAG="v${major}.${minor}.${patch}"
          
          echo "Last tag: $LAST_TAG"
          echo "New tag: $NEW_TAG"
          
          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          
          echo "version=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "should_build=true" >> $GITHUB_OUTPUT

  # Build multi-arch controller image
  build-controller:
    needs: [auto-tag]
    if: |
      always() && 
      (needs.auto-tag.outputs.should_build == 'true' || 
       github.event_name == 'workflow_dispatch' || 
       github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ needs.auto-tag.outputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-controller

  # Build packages for each architecture
  build-packages:
    needs: [auto-tag, build-controller]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ needs.build-controller.outputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Up CLI
        run: |
          curl -sL "https://cli.upbound.io" | sh
          sudo mv up /usr/local/bin/

      - name: Login to Upbound
        continue-on-error: true
        run: up login --token="${{ secrets.UPBOUND_TOKEN || 'no-token' }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull controller image for specific architecture
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pull specific architecture from multi-arch image
          docker pull --platform=linux/${{ matrix.arch }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-controller

      - name: Build package for ${{ matrix.arch }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CONTROLLER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-controller"
          
          echo "Building xpkg for ${VERSION}-${{ matrix.arch }} with controller ${CONTROLLER_IMAGE}"
          ls -la package/
          
          # Build the package (will embed the pulled architecture)
          up xpkg build \
            --package-root=package \
            --controller=${CONTROLLER_IMAGE} \
            -o provider-nutanix-${VERSION}-${{ matrix.arch }}.xpkg

      - name: Push to GHCR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          up xpkg push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-${{ matrix.arch }} \
            -f provider-nutanix-${VERSION}-${{ matrix.arch }}.xpkg

      - name: Push to Upbound
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${VERSION}-${{ matrix.arch }} \
            -f provider-nutanix-${VERSION}-${{ matrix.arch }}.xpkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: provider-nutanix-${{ steps.version.outputs.version }}-${{ matrix.arch }}.xpkg

  # Create GitHub release
  create-release:
    needs: [auto-tag, build-controller, build-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ needs.build-controller.outputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Install Up CLI
        run: |
          curl -sL "https://cli.upbound.io" | sh
          sudo mv up /usr/local/bin/

      - name: Login to Upbound
        continue-on-error: true
        run: up login --token="${{ secrets.UPBOUND_TOKEN || 'no-token' }}"

      - name: Push default version to Upbound (for marketplace indexing)
        continue-on-error: true
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Use AMD64 as default for broader compatibility
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${VERSION} \
            -f packages/package-amd64/provider-nutanix-${VERSION}-amd64.xpkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            # Crossplane Nutanix Provider ${{ steps.version.outputs.version }}
            
            ## 🚀 True Multi-Architecture Release
            
            This release provides **native packages for both AMD64 and ARM64** architectures, built on their respective platforms for optimal compatibility.
            
            ### 📦 Available Images
            
            #### 🎯 Multi-Architecture Controller Image
            ```bash
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-controller
            ```
            **Platforms:** `linux/amd64`, `linux/arm64`
            
            #### 📱 Native Architecture Packages
            ```bash
            # AMD64 packages (built on AMD64)
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
            xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ steps.version.outputs.version }}-amd64
            
            # ARM64 packages (built on ARM64)  
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
            xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ steps.version.outputs.version }}-arm64
            
            # Default packages (ARM64)
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ steps.version.outputs.version }}
            ```
            
            ### 📋 Installation
            
            #### Architecture-Specific (Recommended)
            ```bash
            # For AMD64 Kubernetes clusters
            kubectl crossplane install provider ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
            
            # For ARM64 Kubernetes clusters  
            kubectl crossplane install provider ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
            ```
            
            #### Auto-Detect (Uses default)
            ```bash
            kubectl crossplane install provider ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```
            
            ### ✅ Architecture Verification
            ```bash
            # Verify controller image architectures
            docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-controller
            
            # Verify package architectures
            docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64 | jq '.[0].Architecture'
            docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64 | jq '.[0].Architecture'
            ```
          files: |
            packages/package-amd64/*
            packages/package-arm64/*
            provider-nutanix-${{ steps.version.outputs.version }}.xpkg
          draft: false
          prerelease: false
