name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  DOCKER_BUILDX_VERSION: 'v0.22.0'
  UP_VERSION: 'v0.38.4'
  CROSSPLANE_REGORG: 'ghcr.io/mgeorge67701'
  UPBOUND_REGORG: 'xpkg.upbound.io/mgeorge67701'
  PROVIDER_REPO: provider-nutanix

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Crossplane CI checks
        run: |
          make generate
          make lint
          make build

      - name: Generate CI Summary
        run: |
          echo "## ✅ Continuous Integration" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Code Generation** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linting** | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ✅ Successful |" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Version** | ${{ env.GO_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_CI checks completed at $(date)_" >> $GITHUB_STEP_SUMMARY

  auto_tag:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.3.6")
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --oneline || true)
          
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            # Extract version numbers
            ver=${LAST_TAG#v}
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            
            # Auto-increment patch version
            patch=$((patch+1))
            NEW_TAG="v${major}.${minor}.${patch}"
            
            echo "New version: $NEW_TAG (previous: $LAST_TAG)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push origin $NEW_TAG
            
            echo "VERSION=${NEW_TAG}" >> $GITHUB_OUTPUT
          else
            echo "No new commits, using existing version: $LAST_TAG"
            echo "VERSION=${LAST_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Auto Tag Summary
        run: |
          echo "## 🏷️ Auto Tag Release" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Previous Tag** | $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || 'None') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commits Since Last** | $(git log $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || 'HEAD')..HEAD --oneline | wc -l || 0) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Version tagged at $(date)_" >> $GITHUB_STEP_SUMMARY

  publish-artifacts:
    name: Build and Publish Multi-Arch
    runs-on: ubuntu-latest
    needs: [detect-noop, auto_tag]
    if: needs.detect-noop.outputs.noop != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build All Artifacts (Multi-Arch Docker Images and Packages)
        run: |
          echo "Building multi-arch images and packages..."
          
          # Build all artifacts including multi-arch Docker images and packages
          make XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" VERSION="${{ needs.auto_tag.outputs.version }}" build.all
        env:
          # Use buildx for multi-arch builds
          BUILD_ARGS: "--push"

      - name: Generate Build Summary
        run: |
          echo "## 🔨 Multi-Architecture Build" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Images** | ✅ Built & Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architectures** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Crossplane Package** | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ needs.auto_tag.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | ${{ env.CROSSPLANE_REGORG }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Container Registry**: \`ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms Supported**: Intel/AMD, Apple Silicon, AWS Graviton, Raspberry Pi 5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Build completed at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: _output/**

      - name: Publish to Registries
        run: |
          echo "Publishing to registries..."
          make XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" VERSION="${{ needs.auto_tag.outputs.version }}" publish

      - name: Generate Publish Summary
        run: |
          echo "## 📤 Registry Publishing" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **GitHub Container Registry** | ✅ Published | [\`ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`](https://ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Installation Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl crossplane install provider ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Published at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto_tag.outputs.version }}
          name: Release ${{ needs.auto_tag.outputs.version }}
          body: |
            ## Multi-Architecture Crossplane Nutanix Provider ${{ needs.auto_tag.outputs.version }}
            
            This release provides multi-architecture support for AMD64 and ARM64 platforms.
            
            ### Installation
            
            **From GitHub Container Registry:**
            ```bash
            kubectl crossplane install provider ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}
            ```
            
            ### Supported Architectures
            - `linux/amd64` - Intel/AMD processors
            - `linux/arm64` - Apple Silicon, AWS Graviton, Raspberry Pi 5
            
            ### Available Registries
            - **GitHub Container Registry**: `ghcr.io/${{ github.repository_owner }}/provider-nutanix`
            
            ---
            
            *Note: If you have Upbound credentials configured, this package is also available on the Upbound Marketplace.*
          files: _output/xpkg/linux_amd64/provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Summary
        run: |
          echo "## 🎉 GitHub Release Created" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | [${{ needs.auto_tag.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/${{ needs.auto_tag.outputs.version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifacts** | ✅ .xpkg package included |" >> $GITHUB_STEP_SUMMARY
          echo "| **Multi-Arch** | ✅ AMD64 + ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Raspberry Pi 5** | ✅ Supported |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Install" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl crossplane install provider ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Release created at $(date)_" >> $GITHUB_STEP_SUMMARY

  mirror-to-upbound:
    name: Mirror to Upbound Registry
    needs: [publish-artifacts, auto_tag]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check Upbound Credentials
        id: check_credentials
        run: |
          # Check both possible secret name patterns
          if [ -n "${{ secrets.UPBOUND_ACCESS_ID }}" ] && [ -n "${{ secrets.UPBOUND_TOKEN }}" ]; then
            echo "credentials_available=true" >> $GITHUB_OUTPUT
            echo "credential_type=UPBOUND" >> $GITHUB_OUTPUT
            echo "✅ Upbound credentials are available (UPBOUND_ACCESS_ID found)"
            echo "🔍 Access ID format: ${{ secrets.UPBOUND_ACCESS_ID }}"
            echo "🔍 Token length: ${#${{ secrets.UPBOUND_TOKEN }}} characters"
          elif [ -n "${{ secrets.XPKG_ACCESS_ID }}" ] && [ -n "${{ secrets.XPKG_TOKEN }}" ]; then
            echo "credentials_available=true" >> $GITHUB_OUTPUT
            echo "credential_type=XPKG" >> $GITHUB_OUTPUT
            echo "✅ Upbound credentials are available (XPKG_ACCESS_ID found)"
            echo "🔍 Access ID format: ${{ secrets.XPKG_ACCESS_ID }}"
            echo "🔍 Token length: ${#${{ secrets.XPKG_TOKEN }}} characters"
          else
            echo "credentials_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Upbound credentials not found - skipping mirror step"
            echo "Expected secrets: UPBOUND_ACCESS_ID + UPBOUND_TOKEN or XPKG_ACCESS_ID + XPKG_TOKEN"
          fi

      - name: Setup crane
        if: steps.check_credentials.outputs.credentials_available == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Upbound Registry (UPBOUND credentials)
        if: steps.check_credentials.outputs.credentials_available == 'true' && steps.check_credentials.outputs.credential_type == 'UPBOUND'
        continue-on-error: true
        id: upbound_login
        uses: docker/login-action@v3
        with:
          registry: "xpkg.upbound.io"
          username: ${{ secrets.UPBOUND_ACCESS_ID }}
          password: ${{ secrets.UPBOUND_TOKEN }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      - name: Login to Upbound Registry (XPKG credentials)
        if: steps.check_credentials.outputs.credentials_available == 'true' && steps.check_credentials.outputs.credential_type == 'XPKG'
        continue-on-error: true
        id: upbound_login_xpkg
        uses: docker/login-action@v3
        with:
          registry: "xpkg.upbound.io"
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker

      - name: Mirror to Upbound Registry
        if: steps.check_credentials.outputs.credentials_available == 'true' && (steps.upbound_login.outcome == 'success' || steps.upbound_login_xpkg.outcome == 'success')
        continue-on-error: true
        run: |
          echo "Mirroring images to Upbound Registry..."
          crane copy ${{ env.CROSSPLANE_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} ${{ env.UPBOUND_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} --allow-nondistributable-artifacts
          crane copy ${{ env.CROSSPLANE_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} ${{ env.UPBOUND_REGORG }}/${{ env.PROVIDER_REPO }}:latest --allow-nondistributable-artifacts
          echo "✅ Successfully mirrored to Upbound Registry"

      - name: Generate Upbound Summary - Success
        if: steps.check_credentials.outputs.credentials_available == 'true' && (steps.upbound_login.outcome == 'success' || steps.upbound_login_xpkg.outcome == 'success')
        run: |
          echo "## 🔄 Upbound Registry Mirror" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_credentials.outputs.credential_type }}" == "UPBOUND" ]; then
            echo "| **Access ID** | ${{ secrets.UPBOUND_ACCESS_ID }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Access ID** | ${{ secrets.XPKG_ACCESS_ID }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Registry** | xpkg.upbound.io |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package URL** | [\`xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`](https://marketplace.upbound.io/providers/${{ github.repository_owner }}/provider-nutanix) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Dual Registry Availability" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub**: \`ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upbound**: \`xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Mirrored at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Generate Upbound Summary - Failed
        if: steps.check_credentials.outputs.credentials_available == 'true' && (steps.upbound_login.outcome == 'failure' || steps.upbound_login_xpkg.outcome == 'failure')
        run: |
          echo "## ⚠️ Upbound Registry Mirror" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ⚠️ Failed (Non-Critical) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_credentials.outputs.credential_type }}" == "UPBOUND" ]; then
            echo "| **Access ID** | ${{ secrets.UPBOUND_ACCESS_ID }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Access ID** | ${{ secrets.XPKG_ACCESS_ID }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Reason** | Authentication Failed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "- Credentials may need to be refreshed" >> $GITHUB_STEP_SUMMARY
          echo "- Upbound registry may be temporarily unavailable" >> $GITHUB_STEP_SUMMARY
          echo "- Access ID format may have changed" >> $GITHUB_STEP_SUMMARY
          echo "- Try re-generating credentials at https://console.upbound.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ GitHub Registry Still Available" >> $GITHUB_STEP_SUMMARY
          echo "Your multi-arch images are available at:" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Status checked at $(date)_" >> $GITHUB_STEP_SUMMARY

      - name: Generate Upbound Summary - Skipped
        if: steps.check_credentials.outputs.credentials_available == 'false'
        run: |
          echo "## ⏭️ Upbound Registry Mirror" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | Credentials Not Configured |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 To Enable Upbound Mirroring" >> $GITHUB_STEP_SUMMARY
          echo "Add these secrets to your GitHub repository:" >> $GITHUB_STEP_SUMMARY
          echo "- \`UPBOUND_ACCESS_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`UPBOUND_TOKEN\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Status checked at $(date)_" >> $GITHUB_STEP_SUMMARY

