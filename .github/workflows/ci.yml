name: Crossplane Provider CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Debug event information
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Ref type: ${{ github.ref_type }}"
        echo "Tag: ${{ github.ref_name }}"
        echo "Event action: ${{ github.event.action }}"

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false
    - name: Download dependencies
      run: |
        go clean -modcache || true
        go mod download
      env:
        GOPROXY: https://proxy.golang.org,direct
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
    - name: Run golangci-lint
      run: golangci-lint run --timeout=10m
    - name: Run tests
      run: |
        if find . -name "*_test.go" | grep -q .; then
          go test -v ./...
        else
          echo "No test files found, skipping tests"
        fi
      env:
        CGO_ENABLED: 0
    - name: Run go vet
      run: go vet ./...
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted properly:"
          gofmt -s -l .
          exit 1
        fi
    - name: Generate Go code
      run: make generate
    - name: Generate CRDs
      run: make generate-crds
    - name: Verify generated code compiles
      run: go build ./...
    - name: Upload CRD artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crd-artifacts
        path: config/crd/
        retention-days: 1

  validate-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate root examples directory
      run: |
        if [ -d examples ]; then
          echo "Found examples directory with usage examples"
          find examples/ -name "*.yaml" -o -name "*.yml" | xargs -I {} sh -c 'echo "Checking {}" && cat {} | grep -q "apiVersion" || echo "Note: {} may be documentation example"'
          echo "✅ Examples check completed - examples available in repository"
        else
          echo "No examples directory found."
        fi
    - name: Note about package examples
      run: |
        echo "ℹ️  Examples are provided in the /examples directory of the repository"
        echo "   They are not included in the package to avoid CRD validation conflicts"
        echo "   Users can find complete examples at: https://github.com/mgeorge67701/provider-nutanix/tree/main/examples"

  build:
    runs-on: ubuntu-latest
    needs: [test, validate-examples]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build Crossplane Provider
      run: |
        mkdir -p dist
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build
        BINARY_NAME="provider-nutanix_${{ matrix.goos }}_${{ matrix.goarch }}"
        cp bin/provider dist/$BINARY_NAME
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: provider-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/provider-nutanix_${{ matrix.goos }}_${{ matrix.goarch }}*

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Generate CRDs
      run: make generate-crds
    - name: Prepare package directory
      run: make copy-provider
    - name: Force overwrite CRDs in package directory
      run: |
        echo "Forcibly overwriting CRDs in package/ with freshly generated ones"
        cp -f config/crd/nutanix.crossplane.io_*.yaml package/
    - name: Fix line endings in CRDs
      run: |
        echo "Converting CRLF to LF in CRD files to ensure consistent line endings..."
        # Use dos2unix which is more reliable for line ending conversion
        sudo apt-get update && sudo apt-get install -y dos2unix
        find package/ -name "*.yaml" -exec dos2unix {} \;
        echo "Line endings fixed with dos2unix."
    - name: Clean package directory
      run: |
        # Clean up any backup, temporary, or unwanted files that might confuse package builders
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        # Remove any README.md from package directory to avoid "not exactly one package meta type" error
        rm -f package/README.md
        # Remove examples directory if it exists to avoid validation conflicts
        rm -rf package/examples
        echo "Package directory contents:"
        ls -la package/
    - name: Remove YAML examples from crossplane.yaml to prevent parsing issues
      run: |
        # Simply remove all YAML code blocks to prevent parsing issues
        echo "Cleaning YAML code blocks from crossplane.yaml..."
        perl -i -0pe 's/```yaml.*?```/```yaml\n# YAML examples removed during package build\n# See repository examples directory for complete examples\n```/gms' package/crossplane.yaml
        echo "Cleaned crossplane.yaml - removed embedded YAML examples"
    - name: Install Crossplane CLI
      run: |
        curl -sL https://releases.crossplane.io/stable/current/bin/linux_amd64/crank -o crank
        chmod +x crank
        sudo mv crank /usr/local/bin/
    - name: Build Crossplane package
      run: |
        VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
        echo "Building package version: $VERSION"
        echo "Final package directory contents before build:"
        ls -la package/
        echo "--- Content of package/nutanix.crossplane.io_providerconfigs.yaml ---"
        cat package/nutanix.crossplane.io_providerconfigs.yaml
        echo "--- End of content ---"
        echo "--- Hexdump of package/nutanix.crossplane.io_providerconfigs.yaml ---"
        hexdump -C package/nutanix.crossplane.io_providerconfigs.yaml
        echo "--- End of hexdump ---"
        # Ensure no examples directory exists to avoid validation conflicts
        rm -rf package/examples
        # Try Upbound CLI first (cleaner output), then fallback to Crossplane CLI
        if ! up xpkg build --package-root=package --output=provider-nutanix-${VERSION}.xpkg; then
          echo "Upbound CLI failed, trying Crossplane CLI as fallback..."
          crank xpkg build --package-root=package --package-file=provider-nutanix-${VERSION}.xpkg
        fi
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: crossplane-package
        path: provider-nutanix-*.xpkg

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build all platforms
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 make build
        cp bin/provider dist/provider-nutanix_linux_amd64
        GOOS=linux GOARCH=arm64 make build
        cp bin/provider dist/provider-nutanix_linux_arm64
        GOOS=darwin GOARCH=amd64 make build
        cp bin/provider dist/provider-nutanix_darwin_amd64
        GOOS=darwin GOARCH=arm64 make build
        cp bin/provider dist/provider-nutanix_darwin_arm64
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Install Crossplane CLI
      run: |
        curl -sL https://releases.crossplane.io/stable/current/bin/linux_amd64/crank -o crank
        chmod +x crank
        sudo mv crank /usr/local/bin/
    - name: Build Crossplane package
      run: |
        # Build Linux/amd64 binary for the package
        make copy-provider
        # Clean up any backup, temporary, or unwanted files that might confuse package builders
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        # Remove any README.md from package directory to avoid "not exactly one package meta type" error
        rm -f package/README.md
        # Remove examples directory if it exists to avoid validation conflicts
        rm -rf package/examples
        echo "--- Content of package/crossplane.yaml BEFORE cleaning ---"
        cat package/crossplane.yaml
        # Remove YAML examples from crossplane.yaml to prevent parsing issues
        echo "Cleaning YAML code blocks from crossplane.yaml..."
        perl -i -0pe 's/```yaml.*?```/```yaml\n# YAML examples removed during package build\n# See repository examples directory for complete examples\n```/gms' package/crossplane.yaml
        echo "Cleaned crossplane.yaml - removed embedded YAML examples"
        echo "--- Content of package/crossplane.yaml AFTER cleaning ---"
        cat package/crossplane.yaml
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building package version: $VERSION"
        # Try Upbound CLI first, then fallback to Crossplane CLI
        if ! up xpkg build --package-root=package --output=provider-nutanix-${VERSION}.xpkg; then
          echo "Upbound CLI failed, trying Crossplane CLI..."
          crank xpkg build --package-root=package --package-file=provider-nutanix-${VERSION}.xpkg
        fi
        cp provider-nutanix-${VERSION}.xpkg dist/
    - name: Prepare release assets
      run: |
        cd dist
        for file in provider-nutanix_*; do
          if [[ "$file" != *.xpkg ]]; then
            tar -czf "$file.tar.gz" "$file"
            rm "$file"
          fi
        done
        sha256sum *.{tar.gz,xpkg} > provider-nutanix_SHA256SUMS
        ls -la
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.xpkg
          dist/provider-nutanix_SHA256SUMS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-upbound:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Install Crossplane CLI
      run: |
        curl -sL https://releases.crossplane.io/stable/current/bin/linux_amd64/crank -o crank
        chmod +x crank
        sudo mv crank /usr/local/bin/
    - name: Login to Upbound
      run: |
        echo "Logging in to Upbound..."
        up login
        echo "Login successful"
        up profile current
      env:
        UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
    - name: Build and push Docker image to GitHub Container Registry
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building multi-platform Docker image version: $VERSION"
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker buildx create --use --name multi-platform-builder
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag ghcr.io/mgeorge67701/provider-nutanix:${VERSION} \
          --tag ghcr.io/mgeorge67701/provider-nutanix:latest \
          --push \
          .
        echo "Multi-platform Docker image pushed: ghcr.io/mgeorge67701/provider-nutanix:${VERSION}"
    - name: Build Crossplane package
      run: |
        make copy-provider
        # Clean up any backup, temporary, or unwanted files that might confuse package builders
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        # Remove any README.md from package directory to avoid "not exactly one package meta type" error
        rm -f package/README.md
        # Remove examples directory if it exists to avoid validation conflicts
        rm -rf package/examples
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building package version: $VERSION"
        echo "Package will be built as: provider-nutanix-${VERSION}.xpkg"
        sed -i "s|image:.*|image: ghcr.io/mgeorge67701/provider-nutanix:${VERSION}|" package/crossplane.yaml
        
        # Remove YAML examples from crossplane.yaml to prevent parsing issues
        echo "Cleaning YAML code blocks from crossplane.yaml..."
        perl -i -0pe 's/```yaml.*?```/```yaml\n# YAML examples removed during package build\n# See repository examples directory for complete examples\n```/gms' package/crossplane.yaml
        echo "Cleaned crossplane.yaml - removed embedded YAML examples"
        # Try Upbound CLI first, then fallback to Crossplane CLI
        if ! up xpkg build --package-root=package --output=provider-nutanix-${VERSION}.xpkg; then
          echo "Upbound CLI failed, trying Crossplane CLI..."
          crank xpkg build --package-root=package --package-file=provider-nutanix-${VERSION}.xpkg
        fi
        ls -la provider-nutanix-${VERSION}.xpkg
        echo "Package size: $(du -h provider-nutanix-${VERSION}.xpkg)"
    - name: Login to Upbound
      run: |
        echo "Logging in to Upbound..."
        up login
        echo "Login successful"
        up profile current
      env:
        UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
    - name: Verify package and repository
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Verifying package file exists..."
        ls -la provider-nutanix-${VERSION}.xpkg
        echo "Checking repository access..."
        if ! up repository list | grep -q provider-nutanix; then
          echo "Repository not found, creating it..."
          up repository create provider-nutanix --publish
        fi
        echo "Current user context:"
        up profile current
        echo "Ready to push package: xpkg.upbound.io/mgeorge67701/provider-nutanix:${VERSION}"
    - name: Push to Upbound Marketplace
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Pushing package version: ${VERSION}"
        echo "Full ref name: ${GITHUB_REF_NAME}"
        up xpkg push xpkg.upbound.io/mgeorge67701/provider-nutanix:${VERSION} -f provider-nutanix-${VERSION}.xpkg
        echo "Successfully pushed version ${VERSION}"
        if [[ ! "${VERSION}" =~ (alpha|beta|rc) ]]; then
          echo "Pushing as latest..."
          up xpkg push xpkg.upbound.io/mgeorge67701/provider-nutanix:latest -f provider-nutanix-${VERSION}.xpkg
          echo "Successfully pushed as latest"
        fi
    - name: Update repository publish policy
      run: |
        echo "Updating repository publish policy..."
        up repository update provider-nutanix --publish --private=false || echo "Repository update failed, continuing..."
        echo "Repository update completed"
