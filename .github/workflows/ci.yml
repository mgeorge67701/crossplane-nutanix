name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  DOCKER_BUILDX_VERSION: 'v0.22.0'
  UP_VERSION: 'v0.38.4'
  CROSSPLANE_REGORG: 'ghcr.io/mgeorge67701'
  UPBOUND_REGORG: 'xpkg.upbound.io/mgeorge67701'
  PROVIDER_REPO: provider-nutanix

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Crossplane CI checks
        run: |
          make generate
          make lint
          make build

  auto_tag:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.3.6")
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --oneline || true)
          
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            # Extract version numbers
            ver=${LAST_TAG#v}
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            
            # Auto-increment patch version
            patch=$((patch+1))
            NEW_TAG="v${major}.${minor}.${patch}"
            
            echo "New version: $NEW_TAG (previous: $LAST_TAG)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push origin $NEW_TAG
            
            echo "VERSION=${NEW_TAG}" >> $GITHUB_OUTPUT
          else
            echo "No new commits, using existing version: $LAST_TAG"
            echo "VERSION=${LAST_TAG}" >> $GITHUB_OUTPUT
          fi

  publish-artifacts:
    name: Build and Publish Multi-Arch
    runs-on: ubuntu-latest
    needs: [detect-noop, auto_tag]
    if: needs.detect-noop.outputs.noop != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build All Artifacts (Multi-Arch Docker Images and Packages)
        run: |
          echo "Building multi-arch images and packages..."
          
          # Build all artifacts including multi-arch Docker images and packages
          make XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" VERSION="${{ needs.auto_tag.outputs.version }}" build.all
        env:
          # Use buildx for multi-arch builds
          BUILD_ARGS: "--push"

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: _output/**

      - name: Publish to Registries
        run: |
          echo "Publishing to registries..."
          make XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" VERSION="${{ needs.auto_tag.outputs.version }}" publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto_tag.outputs.version }}
          name: Release ${{ needs.auto_tag.outputs.version }}
          body: |
            ## Multi-Architecture Crossplane Nutanix Provider ${{ needs.auto_tag.outputs.version }}
            
            This release provides multi-architecture support for AMD64 and ARM64 platforms.
            
            ### Installation
            
            **From GitHub Container Registry:**
            ```bash
            kubectl crossplane install provider ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}
            ```
            
            **From Upbound Marketplace:**
            ```bash
            kubectl crossplane install provider xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}
            ```
            
            ### Supported Architectures
            - `linux/amd64` - Intel/AMD processors
            - `linux/arm64` - Apple Silicon, AWS Graviton, Raspberry Pi 5
            
            ### Available Registries
            - **GitHub Container Registry**: `ghcr.io/${{ github.repository_owner }}/provider-nutanix`
            - **Upbound Marketplace**: `xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix`
          files: _output/xpkg/linux_amd64/provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-to-upbound:
    name: Mirror to Upbound Registry
    needs: [publish-artifacts, auto_tag]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to Upbound Registry
        uses: docker/login-action@v3
        with:
          registry: "xpkg.upbound.io"
          username: ${{ secrets.UPBOUND_ACCESS_ID }}
          password: ${{ secrets.UPBOUND_TOKEN }}
        if: env.UPBOUND_ACCESS_ID != '' && env.UPBOUND_TOKEN != ''
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}

      - name: Mirror to Upbound Registry
        run: |
          crane copy ${{ env.CROSSPLANE_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} ${{ env.UPBOUND_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} --allow-nondistributable-artifacts
          crane copy ${{ env.CROSSPLANE_REGORG }}/${{ env.PROVIDER_REPO }}:${{ needs.auto_tag.outputs.version }} ${{ env.UPBOUND_REGORG }}/${{ env.PROVIDER_REPO }}:latest --allow-nondistributable-artifacts
        if: env.UPBOUND_ACCESS_ID != '' && env.UPBOUND_TOKEN != ''
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}

