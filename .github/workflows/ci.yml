name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: false # Disable the built-in cache to avoid tar issues
  # Go module cache step removed to prevent tar extraction errors
      - name: Run unit tests
        run: go test ./...

  auto_tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: set_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --pretty=%s || true)
          
          # Default to existing tag
          VERSION_TO_USE=$LAST_TAG
          
          # Only bump version if there are new, relevant commits
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            bump="patch"
            if echo "$COMMITS_SINCE_TAG" | grep -qE 'BREAKING|breaking|major:'; then
              bump=major
            elif echo "$COMMITS_SINCE_TAG" | grep -qE '(^feat:|^feature:|minor:)'; then
              bump=minor
            fi
            
            ver=${LAST_TAG#v}
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            
            if [ "$bump" = "major" ]; then
              major=$((major+1)); minor=0; patch=0
            elif [ "$bump" = "minor" ]; then
              minor=$((minor+1)); patch=0
            else
              patch=$((patch+1))
            fi
            
            NEW_TAG="v${major}.${minor}.${patch}"
            VERSION_TO_USE=$NEW_TAG
            
            echo "New version determined: $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $NEW_TAG
          else
            echo "No new commits since last tag. Using existing version: $LAST_TAG"
          fi
          
          echo "version=${VERSION_TO_USE}" >> $GITHUB_OUTPUT

  package:
    needs: auto_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: false # Disable the built-in cache to avoid tar issues
  # Go module cache step removed to prevent tar extraction errors
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Login to Upbound Registry
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          up login --username="${{ secrets.UPBOUND_ACCESS_ID }}" --password="${{ secrets.UPBOUND_TOKEN }}"
      - name: Build provider binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -a -ldflags '-extldflags "-static"' -o provider ./cmd/provider
          ls -l ./provider
      - name: Build and Push Docker Image
        run: |
          # Build Docker image for linux/arm64
          docker build --platform=linux/arm64 -t ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }} .
          
          # Check Docker image configuration to verify ENTRYPOINT
          docker inspect ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }} | grep -A 5 "Entrypoint"
          
          # Push Docker image to GitHub Container Registry
          docker push ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}
          
          # Tag and push latest only if this is the main branch (with retry logic)
          docker tag ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }} ghcr.io/${{ github.repository_owner }}/provider-nutanix:latest
          docker push ghcr.io/${{ github.repository_owner }}/provider-nutanix:latest || echo "Latest tag push failed, but continuing..."
      - name: Replace version placeholder
        run: sed -i -e "s/VERSION_PLACEHOLDER/${{ needs.auto_tag.outputs.version }}/g" package/package.yaml
      - name: Build .xpkg
        run: |
          up xpkg build \
            --package-root=package \
            -o provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
      - name: Inspect .xpkg for package.yaml
        run: |
          tar -tf provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg | grep '^package.yaml$' || (echo "ERROR: package.yaml not found at root of .xpkg" && exit 1)
      - name: Upload .xpkg
        uses: actions/upload-artifact@v4
        with:
          name: provider-xpkg
          path: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  publish:
    needs: [package, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download .xpkg artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
          cache: false # Disable the built-in cache to avoid tar issues
  # Go module cache step removed to prevent tar extraction errors
      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Login to Upbound
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          up login --username="${{ secrets.UPBOUND_ACCESS_ID }}" --password="${{ secrets.UPBOUND_TOKEN }}"
      - name: Push package to Upbound Registry
        run: |
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }} \
            -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
          
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix:latest \
            -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  create_release:
    needs: [publish, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .xpkg
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.auto_tag.outputs.version }}
          files: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
