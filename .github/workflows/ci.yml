name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false # Disable the built-in cache to avoid tar issues
      - name: Go cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run unit tests
        run: go test ./...

  auto_tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: set_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --pretty=%s || true)
          
          # Default to existing tag
          VERSION_TO_USE=$LAST_TAG
          
          # Only bump version if there are new, relevant commits
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            bump="patch"
            if echo "$COMMITS_SINCE_TAG" | grep -qE 'BREAKING|breaking|major:'; then
              bump=major
            elif echo "$COMMITS_SINCE_TAG" | grep -qE '(^feat:|^feature:|minor:)'; then
              bump=minor
            fi
            
            ver=${LAST_TAG#v}
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            
            if [ "$bump" = "major" ]; then
              major=$((major+1)); minor=0; patch=0
            elif [ "$bump" = "minor" ]; then
              minor=$((minor+1)); patch=0
            else
              patch=$((patch+1))
            fi
            
            NEW_TAG="v${major}.${minor}.${patch}"
            VERSION_TO_USE=$NEW_TAG
            
            echo "New version determined: $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $NEW_TAG
          else
            echo "No new commits since last tag. Using existing version: $LAST_TAG"
          fi
          
          echo "version=${VERSION_TO_USE}" >> $GITHUB_OUTPUT

  package:
    needs: auto_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false # Disable the built-in cache to avoid tar issues
      - name: Go cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build provider binary
        run: go build -o package/provider ./cmd/provider
      - name: Replace version placeholder
        run: sed -i -e "s/VERSION_PLACEHOLDER/${{ needs.auto_tag.outputs.version }}/g" package/crossplane.yaml
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin
      - name: Verify crossplane CLI
        run: |
          crossplane version --client
      - name: Build .xpkg
        run: |
          crossplane xpkg build --package-root=package -o provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
      - name: Upload .xpkg
        uses: actions/upload-artifact@v4
        with:
          name: provider-xpkg
          path: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  publish:
    needs: [package, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download .xpkg artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: false # Disable the built-in cache to avoid tar issues
      - name: Go cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin
      - name: Verify crossplane CLI
        run: |
          crossplane version --client
      - name: Login to Upbound
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          echo "Attempting login with Access ID: $UPBOUND_ACCESS_ID"
          echo "$UPBOUND_TOKEN" | docker login xpkg.upbound.io -u "$UPBOUND_ACCESS_ID" --password-stdin
      - name: Push package to registry
        run: |
          crossplane xpkg push -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg xpkg.upbound.io/mgeorge67701/provider-nutanix:${{ needs.auto_tag.outputs.version }}
          crossplane xpkg push -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg xpkg.upbound.io/mgeorge67701/provider-nutanix:latest

  create_release:
    needs: [publish, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .xpkg
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          files: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
