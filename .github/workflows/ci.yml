name: Crossplane Provider CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false
    - name: Download dependencies
      run: |
        go clean -modcache || true
        go mod download
      env:
        GOPROXY: https://proxy.golang.org,direct
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
    - name: Run golangci-lint
      run: golangci-lint run --timeout=10m
    - name: Run tests
      run: |
        if find . -name "*_test.go" | grep -q .; then
          go test -v ./...
        else
          echo "No test files found, skipping tests"
        fi
      env:
        CGO_ENABLED: 0
    - name: Run go vet
      run: go vet ./...
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted properly:"
          gofmt -s -l .
          exit 1
        fi
    - name: Generate Go code
      run: make generate
    - name: Generate CRDs
      run: make generate-crds
    - name: Verify generated code compiles
      run: go build ./...
    - name: Upload CRD artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crd-artifacts
        path: config/crd/
        retention-days: 1

  validate-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate examples directory
      run: |
        if [ -d examples ]; then
          echo "✅ Examples directory found"
          find examples/ -name "*.yaml" -o -name "*.yml" | head -5
        else
          echo "No examples directory found."
        fi

  build:
    runs-on: ubuntu-latest
    needs: [test, validate-examples]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build Crossplane Provider
      run: |
        mkdir -p dist
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build
        BINARY_NAME="provider-nutanix_${{ matrix.goos }}_${{ matrix.goarch }}"
        cp bin/provider dist/$BINARY_NAME
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: provider-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/provider-nutanix_${{ matrix.goos }}_${{ matrix.goarch }}*

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Prepare package directory
      run: make copy-provider
    - name: Convert tabs to spaces in YAML files
      run: |
        find package/ -name "*.yaml" -exec sed -i 's/\t/  /g' {} \;
    - name: Clean package directory
      run: |
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        rm -f package/README.md
        rm -rf package/examples
    - name: Build Crossplane package
      run: |
        VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
        echo "Building package version: $VERSION"
        
        # Create package using tar method (proven to work)
        tar -czf provider-nutanix-${VERSION}.xpkg -C package .
        echo "Package created successfully"
        ls -la provider-nutanix-${VERSION}.xpkg
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: crossplane-package
        path: provider-nutanix-*.xpkg

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Build all platforms
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 make build
        cp bin/provider dist/provider-nutanix_linux_amd64
        GOOS=linux GOARCH=arm64 make build
        cp bin/provider dist/provider-nutanix_linux_arm64
        GOOS=darwin GOARCH=amd64 make build
        cp bin/provider dist/provider-nutanix_darwin_amd64
        GOOS=darwin GOARCH=arm64 make build
        cp bin/provider dist/provider-nutanix_darwin_arm64
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Install Crossplane CLI
      run: |
        curl -sL https://releases.crossplane.io/stable/current/bin/linux_amd64/crank -o crank
        chmod +x crank
        sudo mv crank /usr/local/bin/
    - name: Build Crossplane package
      run: |
        make copy-provider
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        rm -f package/README.md
        rm -rf package/examples
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building package version: $VERSION"
        tar -czf provider-nutanix-${VERSION}.xpkg -C package .
        cp provider-nutanix-${VERSION}.xpkg dist/
    - name: Prepare release assets
      run: |
        cd dist
        for file in provider-nutanix_*; do
          if [[ "$file" != *.xpkg ]]; then
            tar -czf "$file.tar.gz" "$file"
            rm "$file"
          fi
        done
        sha256sum *.{tar.gz,xpkg} > provider-nutanix_SHA256SUMS
        ls -la
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.xpkg
          dist/provider-nutanix_SHA256SUMS
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-upbound:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Install Upbound CLI
      run: |
        curl -sL https://cli.upbound.io | sh
        sudo mv up /usr/local/bin/
    - name: Install Crossplane CLI
      run: |
        curl -sL https://releases.crossplane.io/stable/current/bin/linux_amd64/crank -o crank
        chmod +x crank
        sudo mv crank /usr/local/bin/
    - name: Configure Upbound Authentication
      run: |
        echo "Setting up Upbound authentication with token..."
        # Set the token environment variable that up CLI will use
        echo "UP_TOKEN=${UPBOUND_TOKEN}" >> $GITHUB_ENV
        echo "Verifying authentication..."
        # Test authentication by checking profile
        UP_TOKEN="${UPBOUND_TOKEN}" up profile current || echo "Creating default profile..."
      env:
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
    - name: Build and push Docker image to GitHub Container Registry
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building multi-platform Docker image version: $VERSION"
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        docker buildx create --use --name multi-platform-builder
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag ghcr.io/mgeorge67701/provider-nutanix:${VERSION} \
          --tag ghcr.io/mgeorge67701/provider-nutanix:latest \
          --push \
          .
        echo "Multi-platform Docker image pushed: ghcr.io/mgeorge67701/provider-nutanix:${VERSION}"
    - name: Build Crossplane package
      run: |
        make copy-provider
        find package/ -name "*.tmp" -delete || true
        find package/ -name "*.bak" -delete || true
        find package/ -name "*.backup" -delete || true
        rm -f package/README.md
        rm -rf package/examples
        VERSION=${GITHUB_REF_NAME#v}
        echo "Building package version: $VERSION"
        sed -i "s|image:.*|image: ghcr.io/mgeorge67701/provider-nutanix:${VERSION}|" package/crossplane.yaml
        tar -czf provider-nutanix-${VERSION}.xpkg -C package .
        ls -la provider-nutanix-${VERSION}.xpkg
        echo "Package size: $(du -h provider-nutanix-${VERSION}.xpkg)"
    - name: Verify Upbound Authentication
      run: |
        echo "Verifying Upbound authentication status..."
        up profile current || echo "No profile found, will use token directly"
        echo "Authentication setup complete"
    - name: Verify package and repository
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Verifying package file exists..."
        ls -la provider-nutanix-${VERSION}.xpkg
        echo "Checking repository access..."
        
        # Try to list repositories and check if provider-nutanix exists
        if UP_TOKEN="${UPBOUND_TOKEN}" up repository list | grep -q provider-nutanix; then
          echo "Repository provider-nutanix found"
        else
          echo "Repository provider-nutanix not found"
          echo "Note: Repository may need to be created manually via Upbound Console"
          echo "Continuing with package push attempt..."
        fi
        
        echo "Current user context:"
        UP_TOKEN="${UPBOUND_TOKEN}" up profile current || echo "Using token-based authentication"
        echo "Ready to push package: xpkg.upbound.io/mgeorge67701/provider-nutanix:${VERSION}"
      env:
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
    - name: Push to Upbound Marketplace
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Pushing package version: ${VERSION}"
        echo "Full ref name: ${GITHUB_REF_NAME}"
        
        # Attempt to push the package
        if UP_TOKEN="${UPBOUND_TOKEN}" up xpkg push xpkg.upbound.io/mgeorge67701/provider-nutanix:${VERSION} -f provider-nutanix-${VERSION}.xpkg; then
          echo "Successfully pushed version ${VERSION}"
          
          # Only push as latest if this is not a pre-release
          if [[ ! "${VERSION}" =~ (alpha|beta|rc) ]]; then
            echo "Pushing as latest..."
            if UP_TOKEN="${UPBOUND_TOKEN}" up xpkg push xpkg.upbound.io/mgeorge67701/provider-nutanix:latest -f provider-nutanix-${VERSION}.xpkg; then
              echo "Successfully pushed as latest"
            else
              echo "Warning: Failed to push as latest, but version push succeeded"
            fi
          fi
        else
          echo "Error: Failed to push package to Upbound Marketplace"
          echo "This may be due to repository permissions or network issues"
          echo "Package build was successful - manual upload may be required"
          exit 1
        fi
      env:
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
    - name: Update repository publish policy
      run: |
        echo "Updating repository publish policy..."
        if UP_TOKEN="${UPBOUND_TOKEN}" up repository update provider-nutanix --publish --private=false; then
          echo "Repository publish policy updated successfully"
        else
          echo "Warning: Repository publish policy update failed - this is often expected for new repositories"
          echo "Repository may need manual configuration in Upbound Console"
        fi
      env:
        UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
