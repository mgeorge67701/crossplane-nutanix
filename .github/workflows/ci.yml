name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Run unit tests
        run: go test ./...

  auto_tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: set_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=%s || true)
          bump="patch"
          if echo "$COMMITS" | grep -qE 'BREAKING|breaking|major:'; then
            bump=major
          elif echo "$COMMITS" | grep -qE '(^feat:|^feature:|minor:)'; then
            bump=minor
          fi
          ver=${LAST_TAG#v}
          IFS='.' read -r major minor patch <<< "$ver"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}
          if [ "$bump" = "major" ]; then
            major=$((major+1)); minor=0; patch=0
          elif [ "$bump" = "minor" ]; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          NEW_TAG="v${major}.${minor}.${patch}"
          echo "version=${NEW_TAG}" >> $GITHUB_OUTPUT
          if [ "$NEW_TAG" != "$LAST_TAG" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $NEW_TAG
          else
            echo "No new tag required"
          fi

  package:
    needs: auto_tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build provider binary
        run: go build -o package/provider ./cmd/provider
      - name: Replace version placeholder
        run: sed -i -e "s/VERSION_PLACEHOLDER/${{ needs.auto_tag.outputs.version }}/g" package/crossplane.yaml
      - name: Install crossplane CLI
        run: go install github.com/crossplane/crossplane/cmd/crossplane@latest
      - name: Build .xpkg
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          crossplane xpkg build ./package -o provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
      - name: Upload .xpkg
        uses: actions/upload-artifact@v4
        with:
          name: provider-xpkg
          path: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  publish:
    needs: [package, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download .xpkg artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Install crossplane CLI
        run: go install github.com/crossplane/crossplane/cmd/crossplane@latest
      - name: Login to Upbound
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          crossplane xpkg login --username "$UPBOUND_ACCESS_ID" --password "$UPBOUND_TOKEN"
      - name: Push package to registry
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          crossplane xpkg push -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg xpkg.upbound.io/mgeorge67701/provider-nutanix:${{ needs.auto_tag.outputs.version }}

  create_release:
    needs: [publish, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .xpkg
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          files: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
