name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false # Disable the built-in cache to avoid tar issues
  # Go module cache step removed to prevent tar extraction errors
      - name: Run unit tests
        run: go test ./...

  auto_tag:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: set_version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS_SINCE_TAG=$(git log ${LAST_TAG}..HEAD --pretty=%s || true)
          
          # Default to existing tag
          VERSION_TO_USE=$LAST_TAG
          
          # Only bump version if there are new, relevant commits
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            # Always increment patch version
            ver=${LAST_TAG#v}
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}
            
            patch=$((patch+1))
            
            NEW_TAG="v${major}.${minor}.${patch}"
            VERSION_TO_USE=$NEW_TAG
            
            echo "New version determined: $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $NEW_TAG
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $NEW_TAG
          else
            echo "No new commits since last tag. Using existing version: $LAST_TAG"
          fi
          
          echo "version=${VERSION_TO_USE}" >> $GITHUB_OUTPUT

  package:
    needs: auto_tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false # Disable the built-in cache to avoid tar issues
      # Go module cache step removed to prevent tar extraction errors
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Show Dockerfile path
        run: |
          echo "Using Dockerfile at $(pwd)/Dockerfile"
      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Login to Upbound Registry
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          up login --username="${{ secrets.UPBOUND_ACCESS_ID }}" --password="${{ secrets.UPBOUND_TOKEN }}"
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push multi-arch controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}-controller
            ghcr.io/${{ github.repository_owner }}/provider-nutanix:latest-controller
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify multi-arch manifest in GHCR
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}-controller

      - name: Pull multi-arch image for xpkg build
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}-controller
      - name: Debug - Verify package files
        run: |
          echo "Files in package directory:"
          ls -la package/
          echo "Contents of package.yaml:"
          head -20 package/package.yaml
      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Inject controller image into package.yaml
        run: |
          awk 'BEGIN{printed=0} {print} /^spec:$/ && !printed {print "  controller:"; print "    image: ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }}-controller"; printed=1}' package/package.yaml > package/package.yaml.tmp && mv package/package.yaml.tmp package/package.yaml
          echo "Injected controller image:" && grep -n "controller:" -n -A2 package/package.yaml
      - name: Build .xpkg
        run: |
          up xpkg build --package-root=package -o provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
      - name: Upload .xpkg
        uses: actions/upload-artifact@v4
        with:
          name: provider-xpkg
          path: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  publish:
    needs: [package, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download .xpkg artifact
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
          cache: false # Disable the built-in cache to avoid tar issues
  # Go module cache step removed to prevent tar extraction errors
      - name: Install Upbound CLI
        run: |
          curl -sL https://cli.upbound.io | sh
          sudo mv up /usr/local/bin/
      - name: Login to Upbound
        env:
          UPBOUND_ACCESS_ID: ${{ secrets.UPBOUND_ACCESS_ID }}
          UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
        run: |
          up login --username="${{ secrets.UPBOUND_ACCESS_ID }}" --password="${{ secrets.UPBOUND_TOKEN }}"
      - name: Push package to Upbound Registry
        run: |
          # Use up CLI to push the package
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix-xpkg:${{ needs.auto_tag.outputs.version }} -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg || echo "Failed with up CLI push method 1"
          up xpkg push xpkg.upbound.io/${{ github.repository_owner }}/provider-nutanix-xpkg:latest -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg || echo "Failed with up CLI push method 2"
      - name: Login to GitHub Container Registry for xpkg
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push .xpkg to GHCR
        run: |
          up xpkg push ghcr.io/${{ github.repository_owner }}/provider-nutanix:${{ needs.auto_tag.outputs.version }} -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
          up xpkg push ghcr.io/${{ github.repository_owner }}/provider-nutanix:latest -f provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg

  create_release:
    needs: [publish, auto_tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .xpkg
        uses: actions/download-artifact@v4
        with:
          name: provider-xpkg
          path: .
      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.auto_tag.outputs.version }}
          files: provider-nutanix-${{ needs.auto_tag.outputs.version }}.xpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}