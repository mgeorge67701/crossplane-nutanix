apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-nutanix
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-nutanix
  template:
    metadata:
      labels:
        app: provider-nutanix
    spec:
      serviceAccountName: provider-nutanix
      containers:
        - name: provider-nutanix
          # image: xpkg.upbound.io/mgeorge67701/provider-nutanix:latest
          image: ghcr.io/mgeorge67701/provider-nutanix:latest
          imagePullPolicy: Always
          command:
            - /provider
          args:
            - --debug
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
